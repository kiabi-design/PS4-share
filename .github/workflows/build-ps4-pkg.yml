name: Build PS4 FastDrop Stub PKG

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ps4-pkg:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3 python3-pil unzip curl

      - name: Check files
        run: |
          ls -la ps4_fastdrop ps4_fastdrop/source
